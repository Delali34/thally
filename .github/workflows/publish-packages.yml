# The Cloud handoff mints a short-lived GitHub App token only after publication
# succeeds. It is narrowed to Actions write + Contents read on thally-cloud and
# stored behind the main-only release-control environment.

name: Publish packages

run-name: >-
  Publish packages${{ inputs.request_id && format(' · {0}', inputs.request_id) || '' }}

on:
  # CI-gated release-record merges start the package-first tail automatically;
  # manual dispatch remains an idempotent recovery path for an interrupted
  # publish or handoff.
  push:
    branches: [main]
    paths:
      - packages/**
  workflow_dispatch:
    inputs:
      request_id:
        description: Release-controller correlation id for recovery
        required: false
        type: string
      release_commit_sha:
        description: Exact reviewed main commit to recover and publish
        required: true
        type: string

# No long-lived npm registry token is permitted in this workflow. npm uses an
# environment-bound OIDC identity. The cloud handoff gets a separate,
# repository-scoped token only after every registry verification has passed.
permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  plan:
    name: Plan package release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
      base_sha: ${{ steps.package-plan.outputs.base_sha }}
      plan_sha256: ${{ steps.package-plan.outputs.plan_sha256 }}
      has_packages: ${{ steps.package-plan.outputs.has_packages }}
      should_handoff: ${{ steps.release.outputs.should_handoff }}
    steps:
      - name: Reject non-main dispatches
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout trusted release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ! "$RELEASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit_sha must be a full lowercase commit SHA."
            exit 1
          fi
          git -C release-source fetch --no-tags origin main
          selected_sha="${RELEASE_COMMIT_SHA:-$GITHUB_SHA}"
          if [[ ! "$selected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected release must be a full lowercase commit SHA."
            exit 1
          fi
          git -C release-source merge-base --is-ancestor "$selected_sha" origin/main
          if [[ -n "$RELEASE_COMMIT_SHA" ]]; then
            record_path='packages/create-thally-docs/src/stable-scaffold-release.json'
            authoritative_sha="$(
              git -C release-source log -1 --format=%H origin/main -- "$record_path"
            )"
            latest_package_sha="$(
              git -C release-source log -1 --format=%H origin/main -- packages/
            )"
            if [[ "$selected_sha" != "$authoritative_sha" && "$selected_sha" != "$latest_package_sha" ]]; then
              echo "::error::release_commit_sha is not the current stable record or latest package source."
              exit 1
            fi
            if [[ "$selected_sha" == "$authoritative_sha" ]]; then
              git -C release-source show "$selected_sha:$record_path" > "$RUNNER_TEMP/selected-stable.json"
              git -C release-source show "origin/main:$record_path" > "$RUNNER_TEMP/current-stable.json"
              cmp --silent "$RUNNER_TEMP/selected-stable.json" "$RUNNER_TEMP/current-stable.json" || {
                echo "::error::The selected release is no longer the public stable record."
                exit 1
              }
            else
              git -C release-source diff --quiet "$selected_sha" origin/main -- packages/ || {
                echo "::error::Package sources changed after the selected release."
                exit 1
              }
            fi
          fi
          git -C release-source checkout --detach "$selected_sha"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"

      - name: Derive dependency-aware package plan
        id: package-plan
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0{40}$ ]]; then
            base="$(git -C release-source rev-parse "$RELEASE_SHA^")"
          fi
          cd release-source
          node ../.github/scripts/release-package-plan.mjs \
            --base "$base" \
            --output "$RUNNER_TEMP/package-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$(sha256sum "$RUNNER_TEMP/package-plan.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Classify immutable scaffold handoff
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git -C release-source diff --quiet "${{ steps.package-plan.outputs.base_sha }}" HEAD -- \
            packages/create-thally-docs/src/stable-scaffold-release.json; then
            echo "should_handoff=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_handoff=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Test · Pack once
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false

      - name: Checkout immutable release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the authorized immutable release source
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: git -C release-source checkout --detach "$RELEASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Recompute the immutable package plan
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          cd release-source
          node ../.github/scripts/release-package-plan.mjs \
            --base "$BASE_SHA" \
            --output "$GITHUB_WORKSPACE/.release-plan.json"
          echo "$EXPECTED_PLAN_SHA256  $GITHUB_WORKSPACE/.release-plan.json" | sha256sum --check

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Test
        working-directory: release-source
        run: npm test

      # Recheck in the unprivileged verification job, so a record edited in a
      # reviewed PR or recovered manually cannot bypass the promotion gate.
      - name: Verify complete historical scaffold upgrades before packing
        working-directory: release-source
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          git show "$BASE_SHA:packages/create-thally-docs/src/stable-scaffold-release.json" > "$RUNNER_TEMP/outgoing-scaffold-release.json"
          npx tsx .github/scripts/verify-scaffold-upgrades.mts \
            packages/create-thally-docs/src/stable-scaffold-release.json \
            download \
            packages/create-thally-docs/src/previous-scaffold-releases.json \
            "$RUNNER_TEMP/outgoing-scaffold-release.json"

      - name: Pack immutable release artifacts
        run: |
          cd release-source
          node ../.github/scripts/pack-release-workspaces.mjs \
            "$GITHUB_WORKSPACE/.release-artifacts" \
            "$GITHUB_WORKSPACE/.release-plan.json"

      - name: Clean-install the selected tarballs
        run: node .github/scripts/verify-release-install.mjs .release-artifacts/manifest.json

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-${{ needs.plan.outputs.release_sha }}
          path: .release-artifacts
          # upload-artifact excludes hidden paths by default. The leading dot
          # is intentional so package bytes remain isolated from the checkout.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest package bytes
    needs: [plan, verify]
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download immutable release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.plan.outputs.release_sha }}
          path: .release-artifacts

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release-artifacts/*.tgz

  publish:
    name: Publish exact package bytes
    needs: [plan, verify, attest]
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      # No dependency installation, tests, builds, or lifecycle scripts run in
      # this job. npm exchanges OIDC only while publishing pre-attested bytes.
      id-token: write
    steps:
      - name: Checkout trusted publish policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.plan.outputs.release_sha }}
          path: .release-artifacts

      - name: Publish and verify exact tarballs
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: node .github/scripts/publish-release-artifacts.mjs .release-artifacts/manifest.json "$EXPECTED_PLAN_SHA256"

  handoff:
    name: Dispatch immutable record to Thally Cloud
    needs: [plan, publish]
    if: needs.plan.outputs.should_handoff == 'true'
    runs-on: ubuntu-latest
    environment: release-control
    permissions:
      contents: read
    steps:
      - name: Mint the Cloud workflow token
        id: cloud-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_COORDINATOR_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_COORDINATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thally-cloud
          permission-actions: write
          permission-contents: read

      - name: Checkout trusted handoff policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false

      - name: Checkout the published record
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Select the authorized published record
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: git -C release-source checkout --detach "$RELEASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate and prepare the immutable locator
        id: release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ needs.plan.outputs.release_sha }}
          RELEASE_SOURCE_DIRECTORY: release-source
        run: node .github/scripts/prepare-release-handoff.mjs

      - name: Dispatch the cloud release tail
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RECORD_COMMIT_SHA: ${{ steps.release.outputs.record_commit_sha }}
        run: |
          set -euo pipefail
          gh workflow run promote-scaffold-release.yml \
            --repo thallylabs/thally-cloud \
            --ref main \
            -f target_environment=production \
            -f release_id="$RELEASE_ID" \
            -f record_commit_sha="$RECORD_COMMIT_SHA" \
            -f automated=true \
            -f request_id="handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
